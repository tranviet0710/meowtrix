name: Deployment Notification
on: [deployment_status] # Triggers when Vercel updates the status in GitHub

jobs:
  notify:
    # Only run when the deployment is successful
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Message
        uses: appleboy/telegram-action@4cd2253b24c9682a5be99eb6f7ab3484586978fa # master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 **Ship Successful!**
            Project: ${{ github.repository }}
            Env: ${{ github.event.deployment_status.environment }}
            URL: ${{ github.event.deployment_status.target_url }}
            Commited by: ${{ github.actor }}
